[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "tanat-ai40"
version = "0.1.0"
description = "AI-40 rollout client and PPO learner for Tanat Assault"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "torch>=2.8",
  "triton-windows==3.7.1.post27; sys_platform == 'win32'",
]

[project.optional-dependencies]
onnx = ["onnx>=1.18", "onnxruntime>=1.22", "onnxscript>=0.5"]
onnx-gpu = [
  "onnx>=1.18",
  "onnxruntime-gpu>=1.21,<1.27",
  "onnxscript>=0.5",
]

[project.scripts]
tanat-ai40-smoke = "tanat_ai40.train:main"
tanat-ai40-train = "tanat_ai40.train:main"
tanat-ai40-train-matches = "tanat_ai40.train_matches:main"
tanat-ai40-train-async = "tanat_ai40.train_async:main"
tanat-ai40-eval = "tanat_ai40.evaluate:main"
tanat-ai40-eval-ai30 = "tanat_ai40.evaluate_ai30:main"
tanat-ai40-campaign = "tanat_ai40.train_campaign:main"
tanat-ai41-campaign = "tanat_ai40.ai41:main"
tanat-ai41-migrate = "tanat_ai40.migrate_ai41:main"
tanat-ai41-migrate-navigation = "tanat_ai40.migrate_ai41_navigation:main"
tanat-ai41-migrate-strategic = "tanat_ai40.migrate_ai41_strategic:main"
tanat-ai42-actor-smoke = "tanat_ai40.smoke_ai42_actor:main"
tanat-ai42-eval = "tanat_ai40.evaluate_ai42:main"
tanat-ai42-eval-pair = "tanat_ai40.evaluate_ai42_pair:main"
tanat-ai42-benchmark-inference = "tanat_ai40.benchmark_ai42_inference:main"
tanat-ai42-collect-dagger = "tanat_ai40.collect_dagger_ai42:main"
tanat-ai42-collect-dagger-generation = "tanat_ai40.collect_dagger_generation_ai42:main"
tanat-ai42-bc-train = "tanat_ai40.train_ai42_bc:main"
tanat-ai42-ppo-train = "tanat_ai40.train_ai42_ppo:main"
tanat-ai42-ppo-cycle = "tanat_ai40.cycle_ai42_ppo:main"
tanat-ai42-bc-evaluate-checkpoints = "tanat_ai40.evaluate_ai42_bc_checkpoints:main"
tanat-ai42-build-dataset = "tanat_ai40.build_ai42_dataset_go:main"
tanat-ai42-audit-dataset = "tanat_ai40.audit_ai42_dataset:main"
tanat-ai42-compact-dataset = "tanat_ai40.compact_ai42_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]
